# Render Blueprint — https://render.com/docs/blueprint-spec
#
# In Render: New → Blueprint → pick this repository. Render reads this file,
# creates the service, and asks you for the four values marked `sync: false`.
# AUTH_SECRET is generated for you.
services:
  - type: web
    name: dr71codes
    runtime: node
    plan: free
    # The free plan sleeps after 15 minutes idle; the first request after that
    # takes ~30s to wake. Upgrade to Starter when you have paying customers.
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # Generated by Render — you never see or need it.
      - key: AUTH_SECRET
        generateValue: true

      # --- You paste these four in the Render dashboard ---

      # Postgres connection string. Neon's free tier is the quickest:
      # neon.tech → new project → copy the pooled connection string.
      # It must end with ?sslmode=require
      - key: DATABASE_URL
        sync: false

      # openrouter.ai/keys — this is what pays for the six agents.
      - key: OPENROUTER_API_KEY
        sync: false

      # Stripe → Developers → API keys. Use the test key (sk_test_...) first.
      - key: STRIPE_SECRET_KEY
        sync: false

      # The id of your recurring £17.99/month price (price_...).
      - key: STRIPE_PRICE_ID
        sync: false

      # Stripe → Developers → Webhooks → your endpoint → signing secret
      # (whsec_...). Add this after the first deploy, once you know the URL.
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # --- Optional ---
      # Which model writes your code. Leave unset for a sensible default.
      # - key: OPENROUTER_MODEL
      #   value: anthropic/claude-sonnet-4.5
